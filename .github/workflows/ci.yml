name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @starter/ai-agent test

  e2e:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Minimal env so Next.js starts; no real DB or OAuth needed for these tests.
      DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
      AUTH_SECRET: ci-test-secret-value-32-chars-ok
      AUTH_GITHUB_ID: fake
      AUTH_GITHUB_SECRET: fake
      AUTH_GOOGLE_ID: fake
      AUTH_GOOGLE_SECRET: fake
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Install Playwright browsers
        run: pnpm --filter @starter/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @starter/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
